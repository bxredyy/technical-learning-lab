spring.application.name=bookcatalog

# Disable H2
spring.h2.console.enabled=false

# Primary PostgreSQL
spring.datasource.primary.url=jdbc:postgresql://localhost:5433/bookcatalog
spring.datasource.primary.username=bookcatalog
spring.datasource.primary.password=bookcatalog
spring.datasource.primary.driver-class-name=org.postgresql.Driver

# Replica PostgreSQL
spring.datasource.replica.url=jdbc:postgresql://localhost:5434/bookcatalog
spring.datasource.replica.username=bookcatalog
spring.datasource.replica.password=bookcatalog
spring.datasource.replica.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect